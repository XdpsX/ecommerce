name: Ecommerce CI

on:
  pull_request:
    paths:
      - 'services/ecommerce/**'
      - '!services/ecommerce/**/*.md'
      - '.github/workflows/ecommerce-ci.yml'
  push:
    branches: ['develop', 'main']
    paths:
      - 'services/ecommerce/**'
      - '!services/ecommerce/**/*.md'
      - '.github/workflows/ecommerce-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecommerce-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/ecommerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/ecommerce/pom.xml
      - name: Verify Maven Wrapper
        run: chmod +x ./mvnw
      - name: Build and test (includes Spotless check)
        run: ./mvnw -B --no-transfer-progress verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-coverage-report
          path: services/ecommerce/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-test-reports
          path: services/ecommerce/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
