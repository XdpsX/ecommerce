name: Backoffice BFF CI
on:
  pull_request:
    paths:
      - 'services/backoffice-bff/**'
      - 'services/identity/**'
      - 'contracts/openapi/backoffice-bff.yaml'
      - 'contracts/openapi/common/**'
      - '.github/workflows/backoffice-bff-ci.yml'
  push:
    branches: ['develop', 'main', 'phase/**']
    paths:
      - 'services/backoffice-bff/**'
      - 'services/identity/**'
      - 'contracts/openapi/backoffice-bff.yaml'
      - 'contracts/openapi/common/**'
      - '.github/workflows/backoffice-bff-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backoffice-bff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            services/backoffice-bff/pom.xml
            services/identity/pom.xml
      - name: Build Identity producer
        working-directory: services/identity
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress -DskipTests package
      - name: Verify BFF
        working-directory: services/backoffice-bff
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backoffice-bff-test-reports
          path: |
            services/backoffice-bff/target/surefire-reports/
            services/backoffice-bff/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
