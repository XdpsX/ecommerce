name: Identity CI

on:
  pull_request:
    paths:
      - 'services/identity/**'
      - '.github/workflows/identity-ci.yml'
  push:
    branches: ['chore/init-repo', 'main']
    paths:
      - 'services/identity/**'
      - '.github/workflows/identity-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/identity/pom.xml
      - name: Verify Maven Wrapper
        run: chmod +x ./mvnw
      - name: Build and test (includes Spotless check)
        run: ./mvnw -B --no-transfer-progress verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-test-reports
          path: services/identity/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
