name: Notification CI

on:
  pull_request:
    paths:
      - 'services/notification/**'
      - '!services/notification/**/*.md'
      - '.github/workflows/notification-ci.yml'
  push:
    branches: ['develop', 'main', 'phase/**']
    paths:
      - 'services/notification/**'
      - '!services/notification/**/*.md'
      - '.github/workflows/notification-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/notification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/notification/pom.xml
      - name: Verify Maven Wrapper
        run: chmod +x ./mvnw
      - name: Build and test (includes Spotless check)
        run: ./mvnw -B --no-transfer-progress verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-test-reports
          path: services/notification/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
